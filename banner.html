<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML5 Banner</title>
<style>
/* CSS Reset */
* { margin: 0; padding: 0; border: 0; }
 
/* Banner Container */
#banner-container {
    width: 300px;
    height: 250px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #f7f7f7;
    margin: 0 auto;
    border: 0;
}
 
/* Main Content */
#main-content {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}
 
#product-image {
    position: absolute;
    bottom: 25px;
    left: 10px; 
    animation: slideInFromLeft 1s ease forwards;
    z-index: 3;
    transition: all 0.8s ease;
}

/* New animation for center movement */
@keyframes moveToCenter {
    from {
        bottom: 25px;
        left: 10px;
        transform: translate(0, 0);
    }
    to {
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, 40%);
    }
}
 
@keyframes slideIn {
    from { transform: translate(-150%, calc(-50% - 15%)); }
    to { transform: translate(-50%, calc(-50% - 15%)); }
}
 
/* Media Elements */
.top-images-container {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    padding-top: 15px;    
    gap: 8px;
    width: 100%;
    z-index: 5;
    pointer-events: none;
}
.banner-image {
    max-width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    width: 275px;
    height: 163px;
    object-fit: cover;
    z-index: 0;
    border-bottom-right-radius: 15px;
    border: 0;
    box-sizing: border-box;
    outline: none;
}

.top-image-first {
    position: absolute;
    max-width: 200px;
    left: 8px;
    top: 15px;
    margin-top: 8px;
    pointer-events: auto;
    transition: opacity 0.5s ease;
}

.blue-sky-offers {
    position: absolute;
    max-width: 200px;
    left: 8px;
    top: 15px;
    margin-top: 8px;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.top-image-second {
    position: absolute;
    top: 15px;
    right: 25px;
    max-width: 100%;
}

#bg-image {
    z-index: 0;
}

@keyframes slideInFromLeft {
    from {
        left: -100%;
        opacity: 0;
    }
    to {
        left: 10px;
        opacity: 1;
    }
} 

@keyframes slideUpFromRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.left-column {
    position: absolute;
    bottom: 10px;
    left: 15px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    max-width: 200px;
    transform: translateX(0);
    opacity: 0;
    transition: opacity 1s ease;
}

.price-image {
    max-width: 100%;
    display: block;
    opacity: 0; /* Start hidden for fade-in */
    transition: opacity 0.5s ease;
}
.left-column :not(.price-image) {
    transition: opacity 0.5s ease;
}

.left-column .hidden {
    display: none;
}

.left-image {
    max-width: 100%;
    display: block;
    transition: opacity 0.5s ease;
}

.left-text {
    font-family: Arial, sans-serif;
    padding-top: 4px;
    font-size: 5px;
    color:#00095B;
    margin: 0;
    transition: opacity 0.5s ease;
}

.frame-3-left-text {
    font-family: Arial, sans-serif;
    padding-top: 4px;
    font-size: 5px;
    color:#00095B;
    margin: 0;
    opacity: 0;
    display: none;
    transition: opacity 0.5s ease;
}
 
.cta-group {
    position: absolute;
    bottom: 10px;
    right: 0; 
    padding-right: 20px; 
    display: flex;
    flex-direction: column;
    align-items: flex-end; 
    gap: 8px;
    opacity: 1;
    transform: none;
    z-index: 4;
}
.cta-button {
    padding: 8px 15px;
    background: #066fef;
    color: white;
    border-radius: 25px;
    font-family: Arial, sans-serif;
    font-size: 7px;
    cursor: pointer;
    max-width: 80px;
}
 
.cta-icon {
    max-width: 70px;
    display: block;
}
</style>
</head>
<body>
<div id="banner-container">
    <div id="main-content">
        <video class="banner-image" id="bg-video" autoplay muted loop playsinline>
            <source src="assets/ford-clouds.mp4" type="video/mp4">
        </video>

        <div class="top-images-container">
            <img src="assets/first-frame-headline.png" alt="" class="top-image-first">
            <img src="assets/blue-sky-offers.png" alt="" class="blue-sky-offers">
            <img src="assets/stacked-logo.webp" alt="" class="top-image-second">
        </div>
        
        <img id="product-image" src="assets/xlt.webp">
        <div class="cta-group">
            <img class="cta-icon" src="assets/ford-logow.webp" alt="">
            <div class="cta-button">View Deals</div>
        </div>

        <div class="left-column">
            <img src="assets/get-the-ford.png" alt="" class="left-image">
            <img src="assets/Price.webp" alt="" class="left-image price-image">
            <p class="left-text">FFS Finance South Africa (Pty) Ltd, trading as Ford Credit, is an Authorised <br>Financial Services Provider (FSP 31946) and Registered Credit Provider (NCRCP 72)</p>
            <p class="frame-3-left-text">*Terms and conditions apply. Offers valid until April 30, 2025. <br>See your local Ford dealer for complete details.</p>
        </div>
    </div>
</div>
 
<script>
    window.addEventListener('load', initBanner);

    function initBanner() {
        const banner = document.getElementById('banner-container');
        banner.addEventListener('click', () => {
            window.open('https://google.com', '_blank');
        });
    
        const images = document.querySelectorAll('.banner-image');
        images[0].style.display = 'block';
    
        const priceImage = document.querySelector('.price-image');
        const leftColumn = document.querySelector('.left-column');
        const firstLeftImage = document.querySelector('.left-image:not(.price-image)'); // get-the-ford.png
        const leftText = document.querySelector('.left-text');
        const frame3LeftText = document.querySelector('.frame-3-left-text');
        const productImage = document.getElementById('product-image');
        const topImageFirst = document.querySelector('.top-image-first');
        const blueSkyOffers = document.querySelector('.blue-sky-offers');
    
        const imageSequence = [
            'assets/Price.webp',
            'assets/new-price-image.webp',
            'assets/third-price-image.webp'
        ];
        let currentIndex = 0;
        let rotationInterval;

        // Initially hide left-column
        leftColumn.style.opacity = '0';
    
        // Frame 2: After 6 seconds
        setTimeout(() => {
            productImage.style.animation = 'moveToCenter 1s ease forwards';
            leftColumn.style.transition = 'opacity 1s ease';
            leftColumn.style.opacity = '1';
            
            // Fade in Price.webp with the left column
            priceImage.style.transition = 'opacity 0.5s ease';
            priceImage.style.opacity = '1';
            
            frame3LeftText.style.display = 'none'; // Keep hidden until Frame 3
            
            topImageFirst.style.opacity = '0';
            setTimeout(() => {
                blueSkyOffers.style.opacity = '1';
            }, 300);
            rotationInterval = startPriceImageRotation(); // Start price rotation
        }, 6000);
    
        // Frame 3: After 12 seconds
        setTimeout(() => {
            // Fade out initial left text only
            leftText.style.transition = 'opacity 0.5s ease';
            leftText.style.opacity = '0';
            
            // After fade out completes
            setTimeout(() => {
                // Hide initial text
                leftText.style.display = 'none';
                
                // Keep get-the-ford.png and Price.webp visible
                // Fade in frame-3-left-text
                frame3LeftText.style.transition = 'opacity 0.5s ease';
                frame3LeftText.style.opacity = '0';
                frame3LeftText.style.display = 'block';
                setTimeout(() => {
                    frame3LeftText.style.opacity = '1';
                }, 50);
            }, 500); // Wait for fade out to complete (0.5s)
        }, 12000);
    
        function startPriceImageRotation() {
            return setInterval(() => {
                priceImage.style.opacity = '0';
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % imageSequence.length;
                    priceImage.src = imageSequence[currentIndex];
                    priceImage.style.opacity = '1';
                }, 300);
            }, 4000);
        }
    }
</script>
</body>
</html>
